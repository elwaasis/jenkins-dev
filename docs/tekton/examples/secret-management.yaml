# Secret Management in Tekton Pipelines
# This example demonstrates how to handle secrets securely in Tekton

# 1. Basic Secret Creation
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-secret
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "https://index.docker.io/v1/": {
          "username": "your-username",
          "password": "your-password",
          "email": "your-email@example.com"
        }
      }
    }

---
# 2. Git SSH Secret
apiVersion: v1
kind: Secret
metadata:
  name: git-ssh-secret
type: kubernetes.io/ssh-auth
stringData:
  ssh-privatekey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    Your private SSH key content here
    -----END OPENSSH PRIVATE KEY-----
  known_hosts: |
    github.com ssh-rsa 

---
# 3. Database Connection Secret
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
type: Opaque
stringData:
  username: "dbuser"
  password: "dbpassword"
  host: "db.example.com"
  port: "5432"
  database: "myapp"

---
# 4. API Keys Secret
apiVersion: v1
kind: Secret
metadata:
  name: api-keys-secret
type: Opaque
stringData:
  github-token: "ghp_xxxxxxxxxxxxxxxxxxxx"
  slack-webhook: "https://hooks.slack.com/services/xxx/xxx/xxx"
  sonar-token: "sqp_xxxxxxxxxxxxxxxxxxxx"

---
# Task that uses secrets for git operations
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-clone-with-ssh
spec:
  params:
    - name: url
      description: Repository URL to clone (SSH format)
    - name: revision
      description: Git revision to checkout
      default: "main"
  workspaces:
    - name: output
      description: The git repo will be cloned here
    - name: ssh-directory
      description: SSH credentials for git
      optional: true
  steps:
    - name: clone
      image: alpine/git:latest
      workingDir: $(workspaces.output.path)
      env:
        - name: HOME
          value: /tmp
      command: ["/bin/sh"]
      args:
        - -c
        - |
          set -e

          # Setup SSH if workspace is provided
          if [ -d "$(workspaces.ssh-directory.path)" ]; then
            echo "Setting up SSH credentials..."
            mkdir -p /tmp/.ssh
            cp $(workspaces.ssh-directory.path)/ssh-privatekey /tmp/.ssh/id_rsa
            cp $(workspaces.ssh-directory.path)/known_hosts /tmp/.ssh/known_hosts
            chmod 600 /tmp/.ssh/id_rsa
            chmod 644 /tmp/.ssh/known_hosts
            export GIT_SSH_COMMAND="ssh -i /tmp/.ssh/id_rsa -o StrictHostKeyChecking=yes"
          fi

          echo "Cloning repository: $(params.url)"
          git clone $(params.url) .
          git checkout $(params.revision)
          echo "Repository cloned successfully"

---
# Task that uses database secrets
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: database-migration
spec:
  params:
    - name: migration-command
      description: Database migration command to run
      default: "migrate"
  steps:
    - name: run-migration
      image: migrate/migrate:latest
      env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: password
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: database
      command: ["/bin/sh"]
      args:
        - -c
        - |
          echo "Running database migration..."
          DATABASE_URL="postgres://$DB_USERNAME:$DB_PASSWORD@$DB_HOST:$DB_PORT/$DB_NAME?sslmode=disable"

          # Example migration command
          migrate -path /migrations -database "$DATABASE_URL" $(params.migration-command)
          echo "Migration completed"

---
# Task that uses API keys
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: quality-gate-check
spec:
  workspaces:
    - name: source
  steps:
    - name: sonar-scan
      image: sonarsource/sonar-scanner-cli:latest
      workingDir: $(workspaces.source.path)
      env:
        - name: SONAR_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-keys-secret
              key: sonar-token
      command: ["/bin/sh"]
      args:
        - -c
        - |
          echo "Running SonarQube analysis..."
          sonar-scanner \
            -Dsonar.projectKey=my-project \
            -Dsonar.sources=. \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN
          echo "SonarQube analysis completed"

---
# Task for secure container image building
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: secure-build-push
spec:
  params:
    - name: image-name
      description: Name of the container image
    - name: image-tag
      description: Tag of the container image
      default: "latest"
  workspaces:
    - name: source
    - name: dockerconfig
      description: Docker registry credentials
      optional: true
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:latest
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.dockerconfig.path)
      command: ["/kaniko/executor"]
      args:
        - --context=$(workspaces.source.path)
        - --dockerfile=$(workspaces.source.path)/Dockerfile
        - --destination=$(params.image-name):$(params.image-tag)
        - --cache=true
        - --skip-tls-verify-registry=false  # Enforce TLS verification

---
# Task for secure notifications
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: secure-notification
spec:
  params:
    - name: message
      description: Notification message
    - name: pipeline-status
      description: Pipeline execution status
  steps:
    - name: notify-slack
      image: curlimages/curl:latest
      env:
        - name: SLACK_WEBHOOK
          valueFrom:
            secretKeyRef:
              name: api-keys-secret
              key: slack-webhook
      command: ["/bin/sh"]
      args:
        - -c
        - |
          echo "Sending notification to Slack..."

          # Create notification payload
          PAYLOAD=$(cat <<EOF
          {
            "text": "Pipeline Notification",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Pipeline Status:* $(params.pipeline-status)\n*Message:* $(params.message)"
                }
              }
            ]
          }
          EOF
          )

          # Send to Slack
          curl -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK"

          echo "Notification sent successfully"

---
# Pipeline demonstrating secure secret usage
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: secure-pipeline
spec:
  params:
    - name: git-url
      description: Git repository URL (SSH format)
    - name: git-revision
      description: Git revision to build
      default: "main"
    - name: image-name
      description: Container image name
  workspaces:
    - name: shared-data
    - name: ssh-creds
    - name: docker-creds
  tasks:
    - name: secure-clone
      taskRef:
        name: git-clone-with-ssh
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: shared-data
        - name: ssh-directory
          workspace: ssh-creds

    - name: run-migrations
      runAfter: [secure-clone]
      taskRef:
        name: database-migration
      params:
        - name: migration-command
          value: "up"

    - name: quality-check
      runAfter: [secure-clone]
      taskRef:
        name: quality-gate-check
      workspaces:
        - name: source
          workspace: shared-data

    - name: secure-build
      runAfter: [quality-check, run-migrations]
      taskRef:
        name: secure-build-push
      params:
        - name: image-name
          value: $(params.image-name)
        - name: image-tag
          value: "secure-$(params.git-revision)"
      workspaces:
        - name: source
          workspace: shared-data
        - name: dockerconfig
          workspace: docker-creds

    - name: notify-completion
      runAfter: [secure-build]
      taskRef:
        name: secure-notification
      params:
        - name: message
          value: "Secure pipeline completed successfully for $(params.image-name)"
        - name: pipeline-status
          value: "SUCCESS"

---
# Example PipelineRun with secret workspaces
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: secure-pipeline-run
spec:
  pipelineRef:
    name: secure-pipeline
  params:
    - name: git-url
      value: "git@github.com:your-org/your-repo.git"
    - name: git-revision
      value: "main"
    - name: image-name
      value: "docker.io/your-org/your-app"
  workspaces:
    - name: shared-data
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - name: ssh-creds
      secret:
        secretName: git-ssh-secret
    - name: docker-creds
      secret:
        secretName: docker-registry-secret
